# Máquina con 8GB de RAM total — el default de Gradle/D8 se queda sin
# heap al mergear dex (OutOfMemoryError real, encontrado 2026-09-20).
# Xmx conservador + menos workers en paralelo para no competir por RAM.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=false
org.gradle.workers.max=2

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
